name: Wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "setup.py"
      - "src/fablecord/__init__.py"
      - "src/fablecord/_speedups/**"
      - "src/fablecord/net/websocket.py"
      - "src/fablecord/gateway/decoder.py"
      - "src/fablecord/partial_emoji.py"
      - "README.md"
      - "LICENSE"
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "setup.py"
      - "src/fablecord/__init__.py"
      - "src/fablecord/_speedups/**"
      - "src/fablecord/net/websocket.py"
      - "src/fablecord/gateway/decoder.py"
      - "src/fablecord/partial_emoji.py"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*.tar.gz
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/fablecord-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Sdist compiles and loads the extensions
        run: |
          python -m pip install -v dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import fablecord.net.websocket as ws; import fablecord.gateway.decoder as gd; from fablecord.partial_emoji import PartialEmoji; from fablecord._speedups.emoji import EmojiBase; assert ws._frame is not None and ws._parse_frames is not None and gd._peek is not None and PartialEmoji.__bases__[0] is EmojiBase"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error